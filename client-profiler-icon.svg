<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F3F4F6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#F9FAFB"/>

  <!-- Dartboard target -->
  <g transform="translate(100, 95)" filter="url(#shadow)">

    <!-- Outer ring - Red -->
    <circle r="70" fill="url(#red)"/>

    <!-- Second ring - White -->
    <circle r="56" fill="url(#white)"/>

    <!-- Third ring - Red -->
    <circle r="42" fill="url(#red)"/>

    <!-- Fourth ring - White -->
    <circle r="28" fill="url(#white)"/>

    <!-- Bullseye outer - Red -->
    <circle r="17" fill="url(#red)"/>

    <!-- Bullseye center - Green (winning shot) -->
    <circle r="7" fill="url(#green)"/>

  </g>

  <!-- Dart hitting bullseye -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Dart body -->
    <rect x="-2" y="-85" width="4" height="35" fill="url(#blue)" rx="2"/>

    <!-- Dart tip -->
    <path d="M 0,-85 L -3,-50 L 3,-50 Z" fill="#374151"/>

    <!-- Dart flights -->
    <path d="M -6,-52 L -2,-52 L -2,-58 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M 6,-52 L 2,-52 L 2,-58 Z" fill="url(#gold)" opacity="0.9"/>

    <!-- Dart in bullseye indicator -->
    <circle cx="0" cy="0" r="2" fill="url(#blue)"/>
  </g>

  <!-- Corner accent dots (data points) -->
  <g opacity="0.4">
    <circle cx="30" cy="30" r="4" fill="url(#blue)"/>
    <circle cx="170" cy="30" r="4" fill="url(#green)"/>
    <circle cx="30" cy="170" r="4" fill="url(#red)"/>
    <circle cx="170" cy="170" r="4" fill="url(#gold)"/>
  </g>

  <!-- Subtle targeting lines -->
  <g opacity="0.15" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3">
    <line x1="100" y1="20" x2="100" y2="35"/>
    <line x1="100" y1="165" x2="100" y2="180"/>
    <line x1="20" y1="95" x2="35" y2="95"/>
    <line x1="165" y1="95" x2="180" y2="95"/>
  </g>

  <!-- Outer border -->
  <rect width="200" height="200" rx="28" fill="none" stroke="#E5E7EB" stroke-width="2"/>
</svg>
